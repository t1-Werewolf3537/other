<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui">
  
  <title>ЖК &quot;Конфигуратор&quot; 3D-тур по хатам | Кирилл Бахарев</title>  
  <meta name="description" content="3D-тур по хатам Конфигуратора">

  <!-- Open Graph для мессенджеров и соцсетей -->
  <meta property="og:type" content="website"> 
  <meta property="og:title" content="3D-тур по хатам Конфигуратора"> 
  <meta property="og:description" content="Виртуальный тур по интерьеру квартиры | Кирилл Бахарев."> 
  <meta property="og:url" content="https://other.wolf-studio.ru/jpg"> 
  <meta property="og:image" content="https://other.wolf-studio.ru/jpg/img/preview.jpg">

  <link rel="stylesheet" href="vendor/reset.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../favicon.png">
</head>

<body class="multiple-scenes">

  <!-- Контейнер панорамы -->
  <div id="pano"></div>

  <!-- Выезжающее меню выбора других квартир (исправлена вложенность li > a) -->
  <div id="sceneList">
    <ul class="scenes">
      <li class="scene">
        <a href="https://wolf-studio.ru/apartment_78m2/" class="text">1 чушь</a>
      </li>
      <li class="scene">
        <a href="https://wolf-studio.ru/office_48m2/" class="text">дерьмо</a>
      </li>
      <li class="scene">
        <a href="https://wolf-studio.ru/testo-mesto/" class="text">говно</a>
      </li>
    </ul>
  </div>

  <!-- Верхняя плашка с названием -->
  <div id="titleBar">
    <h1 class="sceneName">Тест конфигуратора</h1>
  </div>

  <!-- Кнопка открытия меню квартир -->
  <a href="javascript:void(0)" id="sceneListToggle" aria-label="Меню выбора квартир">
    <img class="icon off" src="img/expand.png" alt="Открыть меню">
    <img class="icon on" src="img/collapse.png" alt="Закрыть меню">
  </a>

  <!-- Логотип застройщика и текстовый баннер -->
  <a href="https://wolfstudio.tb.ru/" target="_blank" rel="noopener noreferrer" class="custom-zhk-top-round">
    <img src="img/logo_zhk.png" alt="ЖК Конфигуратолр" class="zhk-round-img">
  </a>
  <div class="custom-dynamic-image-container">
    <img src="img/text_zhk.png" class="dynamic-responsive-img" alt="ЖК Конфигуратолр">
  </div>

  <!-- Водяной знак Wolf Studio -->
  <a href="https://rutube.ru/my/history/" target="_blank" rel="noopener noreferrer" class="custom-wolf-watermark-bottom">
    <img src="img/circle.png" class="wolf-watermark-bg" alt="">
    <img src="img/site.png" class="wolf-watermark-icon" alt="Wolf Studio">
  </a>

  <!-- Мини-карта планировки -->
  <button id="mini-map-toggle-btn" class="map-open-button">Планировка</button>

  <div id="mini-map-wrapper">
    <div id="mini-map-close-btn">&times;</div>
    <div class="map-inner">
      <img src="img/plan.jpg" id="mini-map-img" alt="Планировка Маяковский Новокузнецк 1-комнатная 39м²">
      <div id="mini-map-points"></div>
      <div id="mini-map-dot"></div>
    </div>
  </div>

  <!-- iOS-переключатель варианта отделки -->
  <div class="ios-switch-wrapper is-hidden">
    <label class="ios-switch">
      <input type="checkbox" id="finish-variant-toggle-btn" aria-label="Переключить вариант отделки">
      <span class="ios-switch-slider"></span>
    </label>
    <div id="finish-variant-hint" class="ios-switch-label-box">
      <svg class="hint-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
      <span>Посмотрите проект с ремонтом</span>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="vendor/bowser.min.js"></script>
  <script src="vendor/marzipano.js"></script>
  <script src="data.js"></script>
  <script src="index.js"></script>

</body>
</html>
